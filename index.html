<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14443f">
  <meta name="robots" content="noindex">
  <title>Buoni</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="home">
    <header class="hero">
      <p class="hero-label">Disponibili</p>
      <p class="hero-count" id="count-available">0</p>
      <p class="hero-value" id="value-available"></p>
      <button class="btn btn-primary btn-large" id="btn-use" type="button">Usa un buono</button>
    </header>

    <section class="stats" aria-label="Riepilogo">
      <div><span id="stat-ordered">0</span><small>Ordinati</small></div>
      <div><span id="stat-received">0</span><small>Ricevuti</small></div>
      <div><span id="stat-used">0</span><small>Usati</small></div>
      <div><span id="stat-missing">0</span><small>Da ricevere</small></div>
    </section>

    <p class="notice" id="notice-expired" hidden></p>

    <button class="notice notice-action" id="notice-backup" type="button" hidden></button>

    <section class="actions">
      <button class="btn" id="btn-import" type="button">Importa PDF</button>
      <button class="btn" id="btn-manual" type="button">Aggiungi a mano</button>
      <button class="btn" id="btn-backup" type="button">Backup</button>
      <input id="file-pdf" type="file" accept="application/pdf,.pdf" multiple hidden>
      <input id="file-backup" type="file" hidden>
    </section>

    <div class="tabs" role="tablist">
      <button class="tab is-active" id="tab-available" type="button" role="tab" aria-selected="true">Disponibili</button>
      <button class="tab" id="tab-used" type="button" role="tab" aria-selected="false">Usati</button>
    </div>
    <ul class="list" id="list"></ul>
    <p class="empty" id="empty" hidden></p>
  </main>

  <section id="pay" class="pay" hidden aria-label="Pagamento">
    <header class="pay-top">
      <button class="btn-link" id="pay-close" type="button">Chiudi</button>
      <p class="pay-session" id="pay-session"></p>
    </header>

    <div class="pay-body" id="pay-body">
      <canvas id="barcode" aria-label="Codice a barre del buono"></canvas>
      <p class="pay-code" id="pay-code"></p>
      <p class="pay-meta" id="pay-meta"></p>
      <button class="btn-link" id="pay-copy" type="button">Copia codice</button>
    </div>

    <div class="pay-finished" id="pay-finished" hidden>
      <p class="pay-finished-title">Nessun altro buono disponibile</p>
    </div>

    <footer class="pay-actions">
      <button class="btn btn-primary btn-large" id="pay-next" type="button">Scansionato, prossimo</button>
      <div class="pay-secondary">
        <button class="btn" id="pay-undo" type="button">Annulla</button>
        <button class="btn" id="pay-skip" type="button">Salta</button>
      </div>
    </footer>
  </section>

  <dialog id="dlg-message">
    <h2 id="message-title"></h2>
    <p id="message-body"></p>
    <ul id="message-list"></ul>
    <form method="dialog"><button class="btn btn-primary">OK</button></form>
  </dialog>

  <dialog id="dlg-confirm">
    <p id="confirm-body"></p>
    <form method="dialog" class="dialog-buttons">
      <button class="btn" value="no">Annulla</button>
      <button class="btn btn-primary" value="yes">Conferma</button>
    </form>
  </dialog>

  <dialog id="dlg-manual">
    <h2>Aggiungi a mano</h2>
    <form id="form-manual" method="dialog">
      <label>Codice
        <input id="manual-code" inputmode="numeric" autocomplete="off" required pattern="[0-9A-Za-z]{4,40}">
      </label>
      <label>Valore in euro
        <input id="manual-value" inputmode="decimal" autocomplete="off" required pattern="[0-9]+([.,][0-9]{1,2})?" value="10">
      </label>
      <label>Scadenza
        <input id="manual-expiry" type="date" required>
      </label>
      <div class="dialog-buttons">
        <button class="btn" type="button" id="manual-cancel">Annulla</button>
        <button class="btn btn-primary" type="submit">Aggiungi</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg-backup">
    <h2>Backup</h2>
    <p>Salva il file su OneDrive. Serve a recuperare i buoni e lo stato "usato" se i dati del browser vengono cancellati.</p>
    <button class="btn btn-primary btn-block" id="backup-export" type="button">Esporta backup</button>
    <button class="btn btn-block" id="backup-restore" type="button">Ripristina da file</button>
    <h3>Conteggi</h3>
    <form id="form-settings" method="dialog">
      <label>Buoni ordinati in totale
        <input id="setting-ordered" type="number" min="0" step="1" required>
      </label>
      <label>Buoni usati prima dell'app
        <input id="setting-used" type="number" min="0" step="1" required>
      </label>
      <div class="dialog-buttons">
        <button class="btn" type="button" id="backup-close">Chiudi</button>
        <button class="btn btn-primary" type="submit">Salva conteggi</button>
      </div>
    </form>
  </dialog>

  <script src="vendor/JsBarcode.code128.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
